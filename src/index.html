<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;"
    />
    <title>TCT Orbit</title>
    <link rel="icon" type="image/png" href="./assets/logo-sm.png" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('tct_theme_mode') || 'dark';
          var accent = localStorage.getItem('tct_theme_accent') || 'orbit-blue';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          root.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
