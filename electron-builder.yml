appId: com.tctorbit.browser
productName: TCT Orbit

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - resources/browser-logo.png
  - resources/icon.ico
  - package.json
  - node_modules/@ghostery/**/*
  - "!**/*.tsbuildinfo"
  - "!**/*.map"
  - "!**/*.md"
  - "!**/tsconfig*.json"

extraResources:
  # The GPL must come with every copy of the program
  - from: LICENSE
    to: LICENSE.txt
  # Extensions that ship with the browser (see electron/builtinExtensions.ts)
  - from: resources/builtin-extensions
    to: builtin-extensions

asar: true
compression: maximum
electronLanguages:
  - en-US

afterPack: build/fuses.cjs

# Updates come from GitHub Releases of this account (electron/essentials/updater.ts). Never point this
# at a domain the project does not own: whoever registers it could ship code to every user.
publish:
  provider: github
  owner: arzurlab
  repo: tct-orbit-browser

# System-wide URL scheme registration
protocols:
  - name: Hypertext Transfer Protocol
    schemes:
      - http
  - name: Hypertext Transfer Protocol Secure
    schemes:
      - https
  - name: TCT Orbit Protocol
    schemes:
      - tct-orbit

# System-wide File Associations (Default Browser integration)
fileAssociations:
  - ext: html
    name: HTML Document
    description: HTML Document
    role: Viewer
    icon: build/icon.ico
  - ext: htm
    name: HTML Document
    description: HTML Document
    role: Viewer
    icon: build/icon.ico
  - ext: xhtml
    name: XHTML Document
    description: XHTML Document
    role: Viewer
    icon: build/icon.ico

# ==============================================================================
# Windows Configuration (Windows 10, Windows 11)
# ==============================================================================
win:
  executableName: tct-orbit
  icon: build/icon.ico
  legalTrademarks: TCT
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Asks on uninstall whether to also delete the user's browser data (see build/installer.nsh)
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  artifactName: tct-orbit-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  displayLanguageSelector: false

portable:
  artifactName: tct-orbit-${version}-${arch}-portable.${ext}

# ==============================================================================
# macOS Configuration (Apple Silicon M1-M4, Universal & Intel x64)
# ==============================================================================
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # What Electron 45 itself needs
  minimumSystemVersion: 13.0.0
  # Ad-hoc signature: free, no Apple account. Without any signature macOS calls the app "damaged";
  # with this one it asks for "Open Anyway" once. With an Apple Developer ID, remove this line, the
  # disable-library-validation entitlement and the updater's macOS check, and turn notarize on.
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
        - universal
    - target: zip
      arch:
        - arm64
        - x64
        - universal
  extendInfo:
    NSCameraUsageDescription: TCT Orbit needs access to your camera for video calls and web conferencing.
    NSMicrophoneUsageDescription: TCT Orbit needs access to your microphone for audio recording and voice calls.
    NSDocumentsFolderUsageDescription: TCT Orbit needs access to your Documents folder for saving files.
    NSDownloadsFolderUsageDescription: TCT Orbit needs access to your Downloads folder for saving downloaded web files.
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        LSItemContentTypes:
          - public.html
          - public.xhtml
    CFBundleURLTypes:
      - CFBundleURLName: Web Site URL
        CFBundleURLSchemes:
          - http
          - https
          - tct-orbit
  notarize: false

dmg:
  artifactName: tct-orbit-${version}-${arch}.${ext}
  title: ${productName} ${version}
  format: ULFO
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ==============================================================================
# Linux Configuration (Ubuntu 22.04/24.04, Debian 12, Fedora, Arch, openSUSE)
# ==============================================================================
linux:
  executableName: tct-orbit
  # Links running windows to the menu entry (icon in the dock, also on Wayland)
  syncDesktopName: true
  maintainer: TCT <arzurlab@users.noreply.github.com>
  category: Network;WebBrowser;
  # Every size the Linux icon theme knows: a single 1024px icon is not found by menus
  icon: build/icons
  mimeTypes:
    - text/html
    - application/xhtml+xml
  synopsis: Fast, Clean, and Modern Desktop Web Browser
  description: TCT Orbit is a fast, clean, and modern web browser built for smooth navigation and distraction-free workflows.
  desktop:
    entry:
      StartupWMClass: tct-orbit
      Terminal: false
      Categories: Network;WebBrowser;
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64

# The current AppImage runtime starts without libfuse2, which new Linux systems no longer have
toolsets:
  appimage: 1.0.3

appImage:
  artifactName: tct-orbit-${version}-${arch}.${ext}

deb:
  artifactName: tct-orbit-${version}-${arch}.${ext}
  packageName: tct-orbit
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libasound2
    - libsecret-1-0
    - xdg-utils

rpm:
  artifactName: tct-orbit-${version}-${arch}.${ext}
  packageName: tct-orbit
  fpm:
    - --iteration=1
    - --rpm-rpmbuild-define=_build_id_links none

pacman:
  artifactName: tct-orbit-${version}-${arch}.${ext}
