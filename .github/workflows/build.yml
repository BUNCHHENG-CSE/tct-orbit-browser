name: Build & Release TCT Orbit

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: macos-latest
            platform: mac
            args: --mac dmg --arm64
          - os: ubuntu-22.04
            platform: linux
            args: --linux AppImage deb --x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Clean Output Directory
        run: npm run clean

      - name: Build Application Bundles
        run: npm run build

      - name: Build Distributables
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Prune Old Run Artifacts
        continue-on-error: true
        shell: bash
        run: |
          node -e "
            const https = require('https');
            const token = process.env.GH_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            if (!token || !repo) process.exit(0);

            function api(path, method = 'GET') {
              return new Promise((resolve) => {
                const req = https.request({
                  hostname: 'api.github.com',
                  path: path,
                  method: method,
                  headers: {
                    'User-Agent': 'Actions-Cleanup',
                    'Authorization': 'token ' + token,
                    'Accept': 'application/vnd.github.v3+json'
                  }
                }, res => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try { resolve(JSON.parse(data)); } catch(e) { resolve(null); }
                  });
                });
                req.on('error', () => resolve(null));
                req.end();
              });
            }

            async function run() {
              try {
                const res = await api('/repos/' + repo + '/actions/artifacts?per_page=100');
                if (res && res.artifacts && Array.isArray(res.artifacts)) {
                  // Never this run's own artifacts: the other platforms may have uploaded theirs already
                  const old = res.artifacts.filter((a) => String(a.workflow_run && a.workflow_run.id) !== process.env.GITHUB_RUN_ID);
                  for (const artifact of old) {
                    console.log('Pruning artifact to free quota:', artifact.name, artifact.id);
                    await api('/repos/' + repo + '/actions/artifacts/' + artifact.id, 'DELETE');
                  }
                }
              } catch(e) {}
            }
            run();
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tct-orbit-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.yml
            dist/*.blockmap
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
